<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOLVER — Experiencia Cinematográfica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="rainCanvas"></canvas>
  <canvas id="particlesCanvas"></canvas>
  <div class="vhs-overlay"></div>
  <div class="cinematic-glow"></div>

  <main class="container-fluid app-shell">
    <section id="introScreen" class="glass-panel intro active-screen">
      <div class="intro-content text-center">
        <h1 class="game-title">VOLVER</h1>
        <p id="introText" class="typewriter"></p>
        <button id="startBtn" class="btn btn-main px-4 py-2 mt-3">Comenzar</button>
      </div>
    </section>

    <section id="storyScreen" class="glass-panel d-none">
      <header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <div>
          <small class="chapter-overline">Historia interactiva</small>
          <h2 id="chapterTitle" class="chapter-title mb-0"></h2>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <button id="restartBtn" class="btn btn-outline-light btn-sm">Reiniciar</button>
        </div>
      </header>

      <div class="progress bg-dark-subtle mb-3"><div id="chapterProgress" class="progress-bar"></div></div>
      <article id="sceneBox" class="scene-box mb-3"></article>
      <section id="choicesBox" class="choices-box"></section>
      <section id="aiBox" class="ai-box mt-3 d-none">
        <div class="ai-head"><i class="bi bi-chat-heart"></i> Eco emocional</div>
        <p id="aiResponse" class="mb-0"></p>
      </section>
    </section>

    <section id="endingScreen" class="glass-panel d-none text-center">
      <div id="endingLines" class="ending-lines"></div>
      <div id="editableBlock" class="d-none mt-4">
        <p class="mb-1">📍 <span id="editableAddress" contenteditable="true" class="editable">DIRECCIÓN EDITABLE</span></p>
        <p class="mb-3">🕰️ <span id="editableTime" contenteditable="true" class="editable">HORA EDITABLE</span></p>
        <p class="final-message">Y si todavía existe una posibilidad…<br>me gustaría comenzar otra historia contigo.</p>
      </div>
    </section>
  </main>


  <audio id="bgm" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2022/05/23/audio_289d5c32f8.mp3"></audio>
  <audio id="rainSfx" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2021/10/28/audio_2f15864fd0.mp3"></audio>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
