<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVOS DEL CORAZÓN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="bgFx"></canvas>
<div class="vignette"></div>

<main class="container-fluid d-flex justify-content-center align-items-center app">
  <section id="intro" class="panel active text-center">
    <h1 class="title">ARCHIVOS DEL CORAZÓN</h1>
    <p id="introType" class="typed"></p>
    <button id="btnAccess" class="btn btn-main mt-4">Acceder</button>
  </section>

  <section id="experience" class="panel d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <small class="text-muted">Investigación emocional</small>
        <h2 id="levelName" class="mb-0"></h2>
      </div>
      <button id="btnRestart" class="btn btn-sm btn-outline-light">Reiniciar</button>
    </div>
    <div class="progress mb-3"><div id="progress" class="progress-bar"></div></div>
    <div id="stage" class="stage"></div>
  </section>

  <section id="ending" class="panel d-none text-center">
    <div id="endingText" class="ending-text"></div>
    <div id="addressBlock" class="d-none mt-4">
      <p contenteditable="true" class="editable">[Dirección editable aquí]</p>
      <p class="mt-2">Y si aún queda una posibilidad…<br/>me gustaría volver a comenzar contigo.</p>
      <button id="btnFinish" class="btn btn-main mt-3">Finalizar experiencia</button>
    </div>
  </section>
</main>

<audio id="bgm" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2022/08/04/audio_2dde668d05.mp3"></audio>
<audio id="tick" preload="auto" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_12b0c7443c.mp3"></audio>
<audio id="ok" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1f3f16d5e4.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
